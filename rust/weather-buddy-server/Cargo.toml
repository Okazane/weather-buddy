[package]
name = "weather-buddy-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-performance Axum HTTP API & static dashboard server for WeatherBuddy with 15-min DashMap cache and enterprise security hardening"

[lib]
name = "weather_buddy_server"
path = "src/lib.rs"

[[bin]]
name = "weather-buddy-server"
path = "src/main.rs"

[dependencies]
weather-buddy-core = { path = "../weather-buddy-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true
dashmap.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
rand.workspace = true
regex.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Devices_Geolocation", "Foundation"] }
