<!DOCTYPE html>
<html lang="vi" data-theme="day_sunny">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherBuddy Popup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="popup">
  <div class="sky-ambient-layer"></div>

  <main class="app-shell">
    <!-- Compact Popup Top Bar -->
    <nav class="top-bar" aria-label="Điều hướng nhanh">
      <div class="brand-cluster">
        <img src="icons/icon32.png" alt="WeatherBuddy" class="brand-logo" />
        <div>
          <div class="brand-name">WeatherBuddy</div>
          <div id="location-title" class="brand-sub">Hà Nội</div>
        </div>
      </div>

      <div class="top-actions">
        <button type="button" id="btn-refresh-weather" class="action-btn" data-label="" title="Cập nhật thời tiết">
          <svg class="ph-icon" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="128" cy="128" r="88" opacity="0.18"/><path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z"/></svg>
        </button>
        <button type="button" data-action-launch-widget="true" class="action-btn" title="Mở Widget nổi trên màn hình Windows">
          <svg class="ph-icon" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><rect x="32" y="48" width="192" height="144" rx="16" transform="translate(256 240) rotate(180)" opacity="0.2"/><path d="M208,40H48A24,24,0,0,0,24,64V176a24,24,0,0,0,24,24h72v16H96a8,8,0,0,0,0,16h64a8,8,0,0,0,0-16H136V200h72a24,24,0,0,0,24-24V64A24,24,0,0,0,208,40ZM48,56H208a8,8,0,0,1,8,8v80H40V64A8,8,0,0,1,48,56ZM208,184H48a8,8,0,0,1-8-8V160H216v16A8,8,0,0,1,208,184Z"/></svg>
        </button>
        <button type="button" id="btn-open-settings" class="action-btn primary" title="Mở bảng cài đặt">
          <svg class="ph-icon" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="104" cy="80" r="24" opacity="0.2"/><circle cx="168" cy="176" r="24" opacity="0.2"/><path d="M40,88H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm64-24A16,16,0,1,1,88,80,16,16,0,0,1,104,64ZM216,168H199a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h97a32,32,0,0,0,62,0h17a8,8,0,0,0,0-16Zm-48,24a16,16,0,1,1,16-16A16,16,0,0,1,168,192Z"/></svg>
          <span>Cài đặt</span>
        </button>
      </div>
    </nav>

    <div id="city-strip" class="city-strip"></div>

    <div id="status-toast" class="status-toast" role="status" aria-live="polite"></div>

    <section id="main-bento-grid" class="main-bento-grid">
      <!-- Living Chibi NPC Stage -->
      <article class="bezel-card">
        <div class="bezel-inner">
          <div class="stage-top-row">
            <span id="weather-badge-pill" class="weather-badge-pill" title="Trạng thái thời tiết hiện tại được phân loại từ nhiệt độ, độ ẩm, khả năng mưa, bức xạ tia cực tím và sức gió">
              <svg class="ph-icon" width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="128" cy="128" r="60" opacity="0.2"/><path d="M120,40V32a8,8,0,0,1,16,0v8a8,8,0,0,1-16,0Zm8,24a64,64,0,1,0,64,64A64.07,64.07,0,0,0,128,64Zm0,112a48,48,0,1,1,48-48A48.05,48.05,0,0,1,128,176ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-8-8A8,8,0,0,0,50.34,61.66Zm0,116.68-8,8a8,8,0,0,0,11.32,11.32l8-8a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l8-8a8,8,0,0,0-11.32-11.32l-8,8A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l8,8a8,8,0,0,0,11.32-11.32ZM40,120H32a8,8,0,0,0,0,16h8a8,8,0,0,0,0-16Zm88,88a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-8A8,8,0,0,0,128,208Zm96-88h-8a8,8,0,0,0,0,16h8a8,8,0,0,0,0-16Z"/></svg>
              <span>Nắng đẹp</span>
            </span>
            <div class="npc-status-cluster">
              <span id="npc-mode-pill" class="npc-mode-pill hidden"></span>
              <button
                type="button"
                id="btn-shuffle-npc"
                class="npc-shuffle-btn"
                title="Đổi hoạt động nhân vật"
              >
                <svg class="ph-icon" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M237.66,178.34l-32-32A8,8,0,0,0,192,152v24h-4.74a56,56,0,0,1-45.89-23.88L95.54,86.65A72,72,0,0,0,36.53,56H32a8,8,0,0,0,0,16h4.53a56,56,0,0,1,45.89,23.88l45.83,65.47A72,72,0,0,0,187.26,192H192v24a8,8,0,0,0,13.66,5.66l32-32A8,8,0,0,0,237.66,178.34ZM149.1,107a8,8,0,0,0,11.16-1.86l1.2-1.71A56,56,0,0,1,207.35,80H208v24a8,8,0,0,0,13.66-5.66l32-32a8,8,0,0,0,0-11.32l-32-32A8,8,0,0,0,192,28.69V56h-.65a72,72,0,0,0-59,30.65l-1.2,1.72A8,8,0,0,0,149.1,107Zm-42.2,42a8,8,0,0,0-11.16,1.86l-1.2,1.71A56,56,0,0,1,48.65,176H32a8,8,0,0,0,0,16H48.65a72,72,0,0,0,59-30.65l1.2-1.72A8,8,0,0,0,106.9,149Z"/></svg>
              </button>
            </div>
          </div>

          <div
            id="character-stage-viewport"
            class="character-stage-viewport"
            role="button"
            tabindex="0"
            aria-label="Nhân vật thời tiết"
          >
            <div class="character-aura"></div>
            <span id="ambient-micro-accent" class="ambient-micro-accent">
              <svg class="ph-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,88a32,32,0,0,1,32-32h64a8,8,0,0,1,8,8V192a8,8,0,0,1-8,8H160a32,32,0,0,0-32,32Z" opacity="0.2"/><path d="M224,48H160a40,40,0,0,0-32,16A40,40,0,0,0,96,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H96a24,24,0,0,1,24,24,8,8,0,0,0,16,0,24,24,0,0,1,24-24h64a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48ZM96,192H32V64H96a24,24,0,0,1,24,24V200A39.81,39.81,0,0,0,96,192Zm128,0H160a39.81,39.81,0,0,0-24,8V88a24,24,0,0,1,24-24h64Z"/></svg>
            </span>
            <div id="character-rig-pivot" class="character-rig-pivot" data-motion="reading_book">
              <img
                id="character-sprite-img"
                class="character-sprite-img"
                src="assets/characters/npc_male_reading_book.png"
                alt="WeatherBuddy Chibi NPC"
              />
            </div>
            <div class="character-ground-shadow"></div>
            <div id="tap-hint-pill" class="tap-hint-pill hidden"></div>
          </div>

          <div id="npc-action-strip" class="npc-action-strip hidden"></div>
          <div id="foresight-alerts" class="foresight-alerts"></div>

          <div class="stage-bottom-summary">
            <div>
              <div class="temp-display-cluster">
                <span id="hero-temp" class="hero-temp tabular" title="Nhiệt độ không khí thực tế hiện tại">26°</span>
              </div>
              <div id="feels-like-tag" class="feels-like-tag tabular" title="Nhiệt độ cảm nhận tính cả độ ẩm và sức gió; biên nhiệt 3h là khoảng thấp nhất – cao nhất trong 3 tiếng tới">Cảm nhận 27°C · Biên nhiệt 3h: 25°–27°C</div>
            </div>
            <div class="decision-copy-cluster">
              <div id="decision-headline" class="decision-headline" title="Tóm tắt chỉ số khí tượng thời gian thực">Trời nắng dịu</div>
              <div id="decision-outfit" class="decision-outfit" title="Gợi ý trang phục và bảo vệ sức khỏe theo chỉ số khí tượng thời gian thực">Mặc trang phục gọn nhẹ thoải mái</div>
            </div>
          </div>
        </div>
      </article>

      <!-- Telemetry & Quick Switchers -->
      <article class="bezel-card">
        <div class="bezel-inner telemetry-column">
          <div id="metrics-grid" class="metrics-grid"></div>
          <div id="hourly-section" class="hourly-section">
            <div class="section-header-row">
              <span>Dự báo 12 giờ tới</span>
              <span id="provider-pill" class="provider-pill" title="Nguồn dữ liệu chỉ số khí tượng thời gian thực">Open-Meteo Live</span>
            </div>
            <div id="hourly-strip" class="hourly-strip"></div>
          </div>
          <div class="persona-quick-row">
            <div class="segmented-group">
              <button type="button" class="seg-btn active" data-gender-btn="male">
                <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="104" cy="152" r="72" opacity="0.2"/><path d="M216,32H168a8,8,0,0,0,0,16h28.69L154.62,90.07a80,80,0,1,0,11.31,11.31L208,59.32V88a8,8,0,0,0,16,0V40A8,8,0,0,0,216,32ZM149.24,197.29a64,64,0,1,1,0-90.53A64.07,64.07,0,0,1,149.24,197.29Z"/></svg>
                <span>Nam</span>
              </button>
              <button type="button" class="seg-btn" data-gender-btn="female">
                <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="128" cy="96" r="72" opacity="0.2"/><path d="M208,96a80,80,0,1,0-88,79.6V200H88a8,8,0,0,0,0,16h32v24a8,8,0,0,0,16,0V216h32a8,8,0,0,0,0-16H136V175.6A80.11,80.11,0,0,0,208,96ZM64,96a64,64,0,1,1,64,64A64.07,64.07,0,0,1,64,96Z"/></svg>
                <span>Nữ</span>
              </button>
            </div>
            <div class="segmented-group">
              <button type="button" class="seg-btn" data-sens-btn="cold_sensitive">
                <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="128" cy="128" r="64" opacity="0.2"/><path d="M220,120H187.31l23.52-23.51a8,8,0,0,0-11.32-11.32L164.69,120H136V91.31l34.83-34.82a8,8,0,0,0-11.32-11.32L136,68.69V36a8,8,0,0,0-16,0V68.69L96.49,45.17A8,8,0,0,0,85.17,56.49L120,91.31V120H91.31L56.49,85.17A8,8,0,0,0,45.17,96.49L68.69,120H36a8,8,0,0,0,0,16H68.69L45.17,159.51a8,8,0,0,0,11.32,11.32L91.31,136H120v28.69L85.17,199.51a8,8,0,0,0,11.32,11.32L120,187.31V220a8,8,0,0,0,16,0V187.31l23.51,23.52a8,8,0,0,0,11.32-11.32L136,164.69V136h28.69l34.82,34.83a8,8,0,0,0,11.32-11.32L187.31,136H220a8,8,0,0,0,0-16Z"/></svg>
                <span>Lạnh</span>
              </button>
              <button type="button" class="seg-btn active" data-sens-btn="normal">
                <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="128" cy="128" r="60" opacity="0.2"/><path d="M120,40V32a8,8,0,0,1,16,0v8a8,8,0,0,1-16,0Zm8,24a64,64,0,1,0,64,64A64.07,64.07,0,0,0,128,64Zm0,112a48,48,0,1,1,48-48A48.05,48.05,0,0,1,128,176ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-8-8A8,8,0,0,0,50.34,61.66Zm0,116.68-8,8a8,8,0,0,0,11.32,11.32l8-8a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l8-8a8,8,0,0,0-11.32-11.32l-8,8A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l8,8a8,8,0,0,0,11.32-11.32ZM40,120H32a8,8,0,0,0,0,16h8a8,8,0,0,0,0-16Zm88,88a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-8A8,8,0,0,0,128,208Zm96-88h-8a8,8,0,0,0,0,16h8a8,8,0,0,0,0-16Z"/></svg>
                <span>Chuẩn</span>
              </button>
              <button type="button" class="seg-btn" data-sens-btn="heat_sensitive">
                <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,144c0,44.18-35.82,80-80,80S48,188.18,48,144c0-56,48-96,80-120C160,48,208,88,208,144Z" opacity="0.2"/><path d="M173.79,51.48a221.25,221.25,0,0,0-41.67-34.34,8,8,0,0,0-8.24,0A221.25,221.25,0,0,0,82.21,51.48C54.59,80.48,40,112.47,40,144a88,88,0,0,0,176,0C216,112.47,201.41,80.48,173.79,51.48ZM128,216a72.08,72.08,0,0,1-72-72c0-26.28,12.5-53.55,36.26-79C104.37,52,117.7,41.21,128,33.54c10.3,7.67,23.63,18.46,35.74,31.46,23.76,25.45,36.26,52.72,36.26,79A72.08,72.08,0,0,1,128,216Z"/></svg>
                <span>Nóng</span>
              </button>
            </div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <!-- Slide-Over Settings Drawer inside Popup -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="control-drawer" class="control-drawer" aria-label="Bảng cài đặt nhanh">
    <div class="drawer-header">
      <div>
        <div class="drawer-title">
          <svg class="ph-icon" width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="104" cy="80" r="24" opacity="0.2"/><circle cx="168" cy="176" r="24" opacity="0.2"/><path d="M40,88H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm64-24A16,16,0,1,1,88,80,16,16,0,0,1,104,64ZM216,168H199a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h97a32,32,0,0,0,62,0h17a8,8,0,0,0,0-16Zm-48,24a16,16,0,1,1,16-16A16,16,0,0,1,168,192Z"/></svg>
          <span>Bảng Chức năng &amp; Cài đặt</span>
        </div>
        <div class="drawer-sub">Tùy chỉnh Chibi NPC, Widget PC &amp; API Key</div>
      </div>
      <button type="button" id="btn-close-settings" class="action-btn drawer-close-btn" aria-label="Đóng">
        <svg class="ph-icon" width="13" height="13" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <section class="settings-card">
        <div class="settings-card-title"><span>Nhân vật &amp; Cơ địa</span></div>
        <div class="field-group">
          <label class="field-label" for="sel-gender">Nhân vật</label>
          <select id="sel-gender" class="field-select">
            <option value="male">Nam · Cậu bé Mây</option>
            <option value="female">Nữ · Cô bé Nắng</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="sel-sensitivity">Độ nhạy nhiệt</label>
          <select id="sel-sensitivity" class="field-select">
            <option value="cold_sensitive">Sợ lạnh (-3°C)</option>
            <option value="normal">Bình thường</option>
            <option value="heat_sensitive">Sợ nóng (+3°C)</option>
          </select>
        </div>
      </section>

      <section class="settings-card">
        <div class="settings-card-title"><span>Module hiển thị</span></div>
        <label class="toggle-row">
          <span class="toggle-label-title">Hiện trên Tab mới</span>
          <input type="checkbox" id="chk-newtab-override" class="switch-input" checked />
        </label>
        <label class="toggle-row">
          <span class="toggle-label-title">Đồng hồ lớn HH:MM</span>
          <input type="checkbox" id="chk-show-clock" class="switch-input" checked />
        </label>
        <label class="toggle-row">
          <span class="toggle-label-title">Thanh tìm kiếm Web</span>
          <input type="checkbox" id="chk-show-search" class="switch-input" checked />
        </label>
        <label class="toggle-row">
          <span class="toggle-label-title">Dự báo 12 giờ tới</span>
          <input type="checkbox" id="chk-show-hourly" class="switch-input" checked />
        </label>
        <label class="toggle-row">
          <span class="toggle-label-title">Lưới chỉ số khí tượng</span>
          <input type="checkbox" id="chk-show-telemetry" class="switch-input" checked />
        </label>
        <label class="toggle-row">
          <span class="toggle-label-title">Tự đổi NPC mỗi 5 phút</span>
          <input type="checkbox" id="chk-auto-rotate-npc" class="switch-input" checked />
        </label>
      </section>

      <section class="settings-card">
        <div class="settings-card-title"><span>Nguồn dữ liệu &amp; Khóa API cá nhân</span></div>
        <div class="field-group">
          <label class="field-label" for="sel-provider">Nguồn ưu tiên</label>
          <select id="sel-provider" class="field-select">
            <option value="auto">Tự động (Đối chiếu đa nguồn / Open-Meteo)</option>
            <option value="open_meteo">Open-Meteo Free (Mặc định)</option>
            <option value="weatherapi">WeatherAPI.com</option>
            <option value="tomorrow_io">Tomorrow.io</option>
            <option value="google">Google Weather API</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="inp-google-key">Google Weather API Key</label>
          <div style="display:flex;gap:4px;">
